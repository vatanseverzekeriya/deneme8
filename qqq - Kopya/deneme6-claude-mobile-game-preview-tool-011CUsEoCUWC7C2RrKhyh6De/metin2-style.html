<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>RPG Mobile - Metin2 Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e27;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            color: white;
        }

        #gameScreen {
            display: none;
        }

        #gameScreen.active {
            display: block;
        }

        /* Character Selection Screen */
        #charSelect {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #charSelect.hidden {
            display: none;
        }

        .select-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #ffd700;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .char-card:hover, .char-card:active {
            transform: scale(1.05);
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .char-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .char-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .char-desc {
            font-size: 12px;
            color: #aaa;
        }

        /* Game Canvas */
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
        }

        .stat-bar {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .bar-container {
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .hp-bar { background: linear-gradient(90deg, #ff4444, #cc0000); }
        .mp-bar { background: linear-gradient(90deg, #4444ff, #0000cc); }
        .xp-bar { background: linear-gradient(90deg, #44ff44, #00cc00); }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 11px;
            line-height: 20px;
            text-shadow: 1px 1px 2px black;
        }

        /* Skills */
        #skills {
            position: fixed;
            bottom: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skill-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            background: rgba(100, 50, 150, 0.8);
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            pointer-events: auto;
            position: relative;
        }

        .skill-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .skill-btn.cooldown {
            opacity: 0.5;
            pointer-events: none;
        }

        .skill-icon {
            font-size: 24px;
        }

        .skill-icon-canvas {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skill-icon-canvas canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .skill-key {
            font-size: 10px;
            margin-top: 2px;
        }

        .cooldown-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Joystick */
        #joystick {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        .joystick-base {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .joystick-stick {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        /* Inventory */
        #inventory {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            pointer-events: auto;
        }

        .inv-row {
            display: flex;
            gap: 5px;
        }

        .inv-slot {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }

        .inv-slot canvas {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }

        .inv-slot.has-item {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .item-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* Damage Numbers */
        .damage-number {
            position: fixed;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px black;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        /* Loot notification */
        #lootNotif {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 120px; opacity: 1; }
        }

        @media (max-width: 768px) {
            .char-grid {
                grid-template-columns: 1fr;
            }

            .select-title {
                font-size: 24px;
            }
        }

        .live-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4ade80;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            z-index: 1000;
        }

        /* Attack Button */
        #attackBtn {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            background: rgba(200, 50, 50, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            pointer-events: auto;
            z-index: 100;
        }

        #attackBtn:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #attackBtn canvas {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        /* Merchant UI */
        .merchant-ui {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            z-index: 1000;
            min-width: 300px;
            pointer-events: auto;
        }

        .merchant-header {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
        }

        .merchant-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .merchant-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffd700;
        }

        .merchant-item-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .merchant-item-icon canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .merchant-item-info {
            flex: 1;
        }

        .merchant-item-name {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .merchant-item-price {
            font-size: 14px;
            color: #ffd700;
        }

        /* Shib Coins Display */
        #shibCoins {
            position: fixed;
            top: 80px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
            z-index: 100;
        }

        /* Equipped Indicator */
        .equipped-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #4ade80;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 3px;
            z-index: 10;
        }

        /* Combo Notification */
        .combo-notification {
            position: fixed;
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 2000;
            animation: comboPop 0.3s ease-out;
            transform: translateX(-50%);
        }

        @keyframes comboPop {
            0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
            50% { transform: translateX(-50%) scale(1.2); }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        @keyframes comboFadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-50px); }
        }

        /* Death UI */
        .death-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ff4444;
            border-radius: 15px;
            padding: 20px;
            z-index: 2000;
            min-width: 250px;
            pointer-events: auto;
        }

        .death-title {
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .death-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .death-option {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .death-option:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffd700;
            transform: scale(1.05);
        }

        .death-option.ready {
            background: rgba(76, 222, 128, 0.2);
            border-color: #4ade80;
            animation: pulseReady 1s infinite;
        }

        @keyframes pulseReady {
            0%, 100% { box-shadow: 0 0 0 0 rgba(76, 222, 128, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(76, 222, 128, 0); }
        }

        .death-option-title {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .death-option-desc {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .death-option-timer {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .death-option.ready .death-option-timer {
            color: #4ade80;
        }

        /* Mini Map */
        .mini-map {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 5px;
            z-index: 100;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .mini-map:hover {
            transform: scale(1.05);
            border-color: #ffd700;
        }

        .mini-map canvas {
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }

        /* Full Map */
        .full-map {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 850px;
            height: 850px;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            z-index: 2000;
            pointer-events: auto;
        }

        .full-map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .full-map-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        .full-map-close {
            font-size: 32px;
            color: #fff;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .full-map-close:hover {
            background: rgba(255, 0, 0, 0.5);
            transform: scale(1.1);
        }

        .full-map canvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div class="live-indicator">● CANLI</div>

    <!-- Character Selection -->
    <div id="charSelect">
        <div class="select-title">GÖLGE ŞÖVALYE</div>
        <div class="char-grid">
            <div class="char-card" onclick="selectCharacter('shadowKnight')">
                <div class="char-icon">SK</div>
                <div class="char-name">GÖLGE ŞÖVALYE</div>
                <div class="char-desc">Karanlık güçlerle donatılmış - Yüksek HP ve savunma</div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="stat-bar">
                <div class="player-info">
                    <span id="playerName">Karakter</span>
                    <span id="playerLevel">Seviye: 1</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill hp-bar" id="hpBar" style="width: 100%"></div>
                    <div class="bar-text" id="hpText">HP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill mp-bar" id="mpBar" style="width: 100%"></div>
                    <div class="bar-text" id="mpText">MP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill xp-bar" id="xpBar" style="width: 0%"></div>
                    <div class="bar-text" id="xpText">XP: 0/100</div>
                </div>
            </div>
            <div id="shibCoins">Shib: 0</div>
        </div>

        <!-- Skills -->
        <div id="skills"></div>

        <!-- Attack Button (Axe) -->
        <div id="attackBtn" class="attack-btn">
            <canvas id="axeIcon" width="32" height="32"></canvas>
        </div>

        <!-- Joystick -->
        <div id="joystick">
            <div class="joystick-base">
                <div class="joystick-stick" id="joystickStick"></div>
            </div>
        </div>

        <!-- Inventory -->
        <div id="inventory">
            <!-- First row - visible slots -->
            <div class="inv-row">
                <div class="inv-slot" id="slot0"></div>
                <div class="inv-slot" id="slot1"></div>
                <div class="inv-slot" id="slot2"></div>
                <div class="inv-slot" id="slot3"></div>
                <div class="inv-slot" id="slot4"></div>
            </div>
            <!-- Additional slots (hidden, but items stored) -->
            <div id="hiddenSlots" style="display: none;"></div>
        </div>

        <!-- Loot Notification -->
        <div id="lootNotif"></div>
    </div>

    <script src="assets/sprite-generator.js"></script>
    <script src="assets/animation-system.js"></script>
    <script src="assets/map-generator.js"></script>
    <script src="assets/map-system.js"></script>
    <script src="assets/biome-system.js"></script>
    <script src="rpg-game.js"></script>

    <script>
        // Live reload (guarded for file:// and missing host)
        (function() {
            try {
                const hasWS = typeof WebSocket !== 'undefined';
                const hasHost = typeof window !== 'undefined' && window.location && window.location.host;
                const isHttp = typeof window !== 'undefined' && (window.location.protocol === 'http:' || window.location.protocol === 'https:');
                if (hasWS && hasHost && isHttp) {
                    const ws = new WebSocket('ws://' + window.location.host);
                    ws.onmessage = function(event) {
                        if (event.data === 'reload') {
                            window.location.reload();
                        }
                    };
                } else {
                    console.warn('Live-reload dev server yok (file:// veya host yok). RPG oyun yine de çalışır.');
                }
            } catch (e) {
                console.warn('Live-reload başlatılamadı:', e);
            }
        })();
    </script>
</body>
</html>
